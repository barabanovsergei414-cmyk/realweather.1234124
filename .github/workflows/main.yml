name: Build PyroRealism 0.3.0

'on':
  workflow_dispatch:
  push:
    paths:
      - 'PyroRealism-Model-Animated-NoCache-SOURCE.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE="PyroRealism-Model-Animated-NoCache-SOURCE.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.source.outputs.zip }}" -d extracted

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          BUILD_FILE="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle not found in source archive"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
          cache-disabled: true

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PyroRealism-0.3.0-Model-Fire-Smoke
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
